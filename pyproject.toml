[project]
name = "sisyphus-engine"
version = "0.1.0"
description = "Explainable, personalised match intelligence from synthetic football tracking and event data."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "agent-framework-core>=1.21.0",
    "agent-framework-foundry>=1.14.1",
    "azure-identity>=1.17",
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=2.0",
    "pandas>=2.2",
    "plotly>=5.24",
    "pyarrow>=17.0",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "scipy>=1.14",
    "streamlit>=1.38",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
sisyphus = "sisyphus.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sisyphus"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # long f-strings in templates/UI are intentional; formatter handles code

[tool.pytest.ini_options]
testpaths = ["tests"]
